name: Staging DB

# Applique les migrations au Supabase de staging après chaque fusion dans main. Les previews Vercel
# lisent ce projet. Inactif tant que la variable SUPABASE_STAGING_PROJECT_REF n'est pas définie
# (Settings → Secrets and variables → Actions) : voir docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: staging-db
  cancel-in-progress: false # une migration interrompue laisserait la base à mi-chemin

jobs:
  migrate:
    if: vars.SUPABASE_STAGING_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      - name: Migrations en attente
        run: pnpm exec supabase db push --dry-run
      - run: pnpm exec supabase db push
